[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D", "RET", "PL"]
# PLR0911: the cache decision in _ttl_for is a guard-clause cascade, which
# reads better flat than nested.
ignore = ["D203", "D213", "PLR0911"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR2004"]
